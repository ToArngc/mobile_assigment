name: Sync GTFS static

on:
  schedule:
    # Design doc §8 calls for once-daily; KTMB publishes at 00:01 MYT, so this
    # runs at 00:30 MYT (16:30 UTC the previous day). Use workflow_dispatch for
    # an immediate sync when timetable_entries need to be populated now.
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r pipeline/requirements.txt

      - run: python pipeline/sync_static.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
