# Keep the Android build usable alongside an emulator on computers with
# limited RAM. The previous 8 GB heap prevented the Kotlin daemon from
# starting when Windows could not reserve that much memory.
# A single worker and Serial GC minimise the extra memory reserved by Gradle.
# 1 GB was insufficient for Android resource and dependency compilation.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
